<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Play and Win</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#050914;
  color:#fff;
  font-family:Arial,sans-serif;
}
.app{
  max-width:480px;
  min-height:100vh;
  margin:auto;
  background:linear-gradient(180deg,#081426,#030711);
  padding-bottom:80px;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 16px;
}
.logo{
  font-size:22px;
  font-weight:900;
}
.logo span{color:#8b5cf6}

.wallet{
  background:#111e34;
  border:1px solid #263957;
  padding:9px 13px;
  border-radius:14px;
  font-weight:bold;
}

/* HERO */
.hero{
  margin:5px 14px 20px;
  padding:25px 20px;
  border-radius:24px;
  background:linear-gradient(135deg,#4c1d95,#1d4ed8);
  box-shadow:0 15px 40px #0008;
}
.hero h1{
  font-size:30px;
  margin-bottom:9px;
}
.hero p{
  color:#dbe4f2;
  margin-bottom:20px;
}
.hero button{
  border:0;
  padding:12px 18px;
  border-radius:12px;
  font-weight:bold;
  color:#281052;
}

/* SECTION */
.section{padding:0 14px}
.title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:20px 0 12px;
}
.title h2{font-size:18px}
.muted{
  color:#91a0b7;
  font-size:13px;
}

/* STATS */
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}
.stat{
  background:#0d1a2d;
  border:1px solid #1d3150;
  border-radius:15px;
  padding:14px 5px;
  text-align:center;
}
.stat b{
  font-size:18px;
}

/* TOURNAMENT */
.card{
  background:#0c192c;
  border:1px solid #1d3150;
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
}
.tag{
  display:inline-block;
  background:#153b60;
  color:#6edcff;
  padding:5px 9px;
  border-radius:20px;
  font-size:10px;
  font-weight:bold;
}
.card h3{
  margin:12px 0 12px;
}
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}
.join{
  border:0;
  background:#6d3df5;
  color:white;
  padding:10px 13px;
  border-radius:10px;
  font-weight:bold;
}

/* NAV */
nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:480px;
  background:#07101ef5;
  border-top:1px solid #1c2d47;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding:10px 4px;
  backdrop-filter:blur(12px);
}
nav a{
  text-align:center;
  text-decoration:none;
  color:#91a0b7;
  font-size:12px;
}
nav a:first-child{color:#a78bfa}
nav div{
  font-size:20px;
  margin-bottom:3px;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">👑 PLAY <span>AND WIN</span></div>
  <div class="wallet">₹250</div>
</header>

<section class="hero">
  <h1>Free Fire Tournaments</h1>
  <p>Play • Compete • Earn</p>
  <button>View Tournaments</button>
</section>

<section class="section">

<div class="title">
  <h2>My Stats</h2>
</div>

<div class="stats">
  <div class="stat">
    <b>10</b>
    <div class="muted">Coins</div>
  </div>

  <div class="stat">
    <b>₹250</b>
    <div class="muted">Wallet</div>
  </div>

  <div class="stat">
    <b>3</b>
    <div class="muted">Joined</div>
  </div>
</div>

<div class="title">
  <h2>Upcoming Tournaments</h2>
  <span class="muted">View All</span>
</div>

<div class="card">
  <span class="tag">BERMUDA MAP</span>

  <h3>Free Fire — Bermuda</h3>

  <div class="row">
    <span class="muted">
      Entry ₹10 • Prize ₹500
    </span>

    <button class="join">Join Now</button>
  </div>
</div>

<div class="card">
  <span class="tag">FULL MAP</span>

  <h3>Free Fire — Full Map</h3>

  <div class="row">
    <span class="muted">
      Entry ₹25 • Prize ₹1,000
    </span>

    <button class="join">Join Now</button>
  </div>
</div>

</section>

<nav>
  <a href="#">
    <div>⌂</div>
    Home
  </a>

  <a href="#">
    <div>🏆</div>
    Tournaments
  </a>

  <a href="#">
    <div>₹</div>
    Wallet
  </a>

  <a href="#">
    <div>●</div>
    Profile
  </a>
</nav>

</div>

</body>
  </html>
